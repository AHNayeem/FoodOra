  """Courier tip: the subtotal × the chosen fraction."""
  tip: Money!
  total: Money!
}

"""
Where an order got to. Lifecycle order, which is what drives the progress bar. One of: placed | confirmed | preparing | packing | ready | rider-assigned | picked-up | on-the-way | arrived | delivered | completed | rejected | cancelled | delivery-failed | returned | refunded.
