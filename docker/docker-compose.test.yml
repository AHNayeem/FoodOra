# =============================================================================
# Ephemeral stores for CI (D10 §CI/CD).
#
#     docker compose -f docker/docker-compose.test.yml up -d --wait
#     cd backend && bun run test:integration
#
# Everything is in tmpfs and nothing is persisted: a test run that depends on
# state left by the previous one is a test run that passes for the wrong reason.
# Ports are shifted so this can run alongside the dev stack.
# =============================================================================

name: foodora-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodora
      POSTGRES_PASSWORD: foodora
      POSTGRES_DB: foodora_test
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5433:5432'
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Durability is worthless here and slow: no fsync, no WAL flushing, all of
    # it in RAM. A CI database that survives a crash has nothing worth saving.
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodora -d foodora_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
