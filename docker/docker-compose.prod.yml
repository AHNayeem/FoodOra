# =============================================================================
# Reference single-host deployment (D10 §Docker).
#
# This is a REFERENCE, not the production topology. Real production runs the
# same image on an orchestrator with autoscaling (API 3→12, workers 2→8), a
# managed Postgres with a streaming replica and PgBouncer, managed Redis with
# failover, and real object storage — none of which belongs in a compose file.
# What this file is good for: a staging box, a demo, or a customer who wants the
# platform on one machine.
#
#     docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
#
# Every secret comes from the environment. Nothing sensitive is written here,
# and the image is pinned by digest, never by a tag (D10 §Docker).
#
# Note the `deploy:` blocks are honoured by Swarm; plain Compose reads
# `replicas` and ignores the rollout policy. They are written out anyway because
# they document the intended rollout, which is what a real orchestrator config
# is generated from.
# =============================================================================

name: foodora

x-api-base: &api-base
  image: ${API_IMAGE:?set API_IMAGE to an immutable digest, e.g. registry/foodora-api@sha256:...}
  restart: always
  environment:
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?}
    DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?}
    REDIS_URL: ${REDIS_URL:?}
    REDIS_QUEUE_URL: ${REDIS_QUEUE_URL:?}
    REDIS_PUBSUB_URL: ${REDIS_PUBSUB_URL:?}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
    OTP_PEPPER: ${OTP_PEPPER:?}
    S3_ENDPOINT: ${S3_ENDPOINT:?}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    CDN_BASE_URL: ${CDN_BASE_URL:?}
    APP_URL: ${APP_URL:?}
    WEB_URL: ${WEB_URL:?}
    CORS_ORIGINS: ${CORS_ORIGINS:?}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Boot refuses either of these on in production; set explicitly anyway, so
    # the intent is in the file rather than only in the validator.
    GRAPHQL_PLAYGROUND: 'false'
    GRAPHQL_INTROSPECTION: 'false'
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  # Runs to completion before the API rolls. Ten pods racing `migrate deploy` is
  # a lock convoy; one job that must succeed first is not (D10 §CI/CD).
  #
  # `dist/migrate.js` lands in E12 with the migrations themselves — the
  # distroless runtime has no shell and no Prisma CLI, so the deploy step is a
  # Node entrypoint that calls the migration engine directly.
  migrate:
    <<: *api-base
    restart: 'no'
    command: ['dist/migrate.js']
    deploy:
      replicas: 1

  api:
    <<: *api-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:4000:4000' # Nginx terminates TLS in front; never bind 0.0.0.0
    deploy:
      replicas: ${API_REPLICAS:-3}
      update_config:
        order: start-first # surge 1, unavailable 0
        failure_action: rollback
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Above the longest expected job, so a deploy cannot kill a payment capture
    # mid-flight.
    stop_grace_period: 60s

  # Same image, different entrypoint — so the API and its workers can never
  # disagree about the schema. Scales on queue depth, not on request traffic.
  worker:
    <<: *api-base
    command: ['dist/worker.js'] # arrives with E8
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    stop_grace_period: 120s
