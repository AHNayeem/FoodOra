# =============================================================================
# Local development stack (D10 §Docker).
#
#     docker compose -f docker/docker-compose.dev.yml up -d
#
# One command to a working environment, which is the difference between a
# documented setup and a followed one. Run from the repository root — the build
# context is `..` because the API image needs `database/prisma/schema`.
# =============================================================================

name: foodora-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodora
      POSTGRES_PASSWORD: foodora
      POSTGRES_DB: foodora
      # C locale + explicit UTF-8: collation differences between a developer's
      # machine and production change ORDER BY results on Bangla and Arabic text.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodora -d foodora']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: foodora-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    # One instance, three logical databases (see redis.config.ts). `noeviction`
    # is the safe global default: db 1 holds jobs, and an evicted job is lost
    # work. The cache namespace expires its own keys with TTLs instead.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: foodora-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: foodora
      MINIO_ROOT_PASSWORD: foodora123
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the two buckets once, then exits. `foodora-public` is CDN-fronted;
  # `foodora-private` holds rider documents and invoices and is never public.
  minio-init:
    image: minio/mc:latest
    container_name: foodora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 foodora foodora123 &&
      mc mb --ignore-existing local/foodora-public &&
      mc mb --ignore-existing local/foodora-private &&
      mc anonymous set download local/foodora-public
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: foodora-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI — every email the platform sends, readable
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: development
    container_name: foodora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4000:4000'
      - '9229:9229' # node inspector
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      APP_URL: http://localhost:4000
      WEB_URL: http://localhost:3005
      CORS_ORIGINS: http://localhost:3005
      LOG_LEVEL: debug
      LOG_PRETTY: 'true'
      DATABASE_URL: postgresql://foodora:foodora@postgres:5432/foodora?schema=public&connection_limit=10
      DATABASE_DIRECT_URL: postgresql://foodora:foodora@postgres:5432/foodora?schema=public
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_URL: redis://redis:6379/1
      REDIS_PUBSUB_URL: redis://redis:6379/2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: foodora
      S3_SECRET_ACCESS_KEY: foodora123
      CDN_BASE_URL: http://localhost:9000/foodora-public
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      GRAPHQL_PLAYGROUND: 'true'
      GRAPHQL_INTROSPECTION: 'true'
    volumes:
      # Source is bind-mounted for watch mode; node_modules and the generated
      # client stay in the image, because both are platform-specific and a
      # macOS host would shadow them with the wrong binaries.
      - ../backend:/app
      - /app/node_modules
      - /app/src/infrastructure/prisma/generated
      - ../database/prisma:/schema/prisma:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
